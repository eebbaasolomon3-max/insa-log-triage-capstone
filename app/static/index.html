<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSA SOC Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }
        .pulse-ring { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        /* Custom Scrollbar for chat */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased min-h-screen flex flex-col">
    
    <nav class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <h1 class="text-xl font-bold tracking-wider">INSA SOC <span class="text-blue-500">Copilot</span></h1>
            </div>
            <div class="flex items-center space-x-2 text-sm text-green-400">
                <span class="relative flex h-3 w-3"><span class="pulse-ring absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>
                <span>API Connected</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow w-full">
        
        <!-- Left Column: Input -->
        <div class="lg:col-span-1 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl h-fit">
            <h2 class="text-lg font-semibold mb-4 text-white">Log Ingestion</h2>
            <form id="logForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Component</label>
                    <input type="text" id="component" value="dfs.FSNamesystem" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Level</label>
                    <select id="level" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="INFO">INFO</option>
                        <option value="WARN" selected>WARN</option>
                        <option value="ERROR">ERROR</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Event Template</label>
                    <textarea id="event_template" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>BLOCK* NameSystem.addStoredBlock: blockMap updated: <*> is added to <*> size <*></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors">Analyze Log</button>
                <button type="button" id="simulateBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors">▶ Run Simulation</button>
            </form>
        </div>

        <!-- Right Column: Results & Chat -->
        <div class="lg:col-span-2 space-y-6 flex flex-col">
            
            <!-- Results Panel -->
            <div id="resultPanel" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl hidden transition-all duration-500 transform translate-y-4 opacity-0 shrink-0">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-white">Analysis Report</h2>
                    <span id="predictionBadge" class="px-3 py-1 rounded-full text-sm font-bold"></span>
                </div>
                
                <div class="mb-4">
                    <p class="text-sm text-slate-400 mb-1">MITRE ATT&CK Tactic:</p>
                    <p id="mitreText" class="text-red-400 font-bold text-sm"></p>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <p class="text-sm text-slate-400 mb-1">LLM Incident Report:</p>
                    <p id="explanationText" class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap"></p>
                </div>
            </div>

            <!-- Chat Copilot (ChatGPT Style) -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl flex flex-col h-[500px]">
                <!-- Chat Header -->
                <div class="p-4 border-b border-slate-700 bg-slate-800/50 rounded-t-xl shrink-0">
                    <h2 class="text-lg font-semibold text-white flex items-center">
                        <span class="mr-2">🤖</span> SOC Copilot Chat
                    </h2>
                </div>

                <!-- Chat Messages Area -->
                <div id="chatHistory" class="flex-1 overflow-y-auto p-4 space-y-6 flex flex-col">
                    <div class="flex items-start">
                        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 mr-3">AI</div>
                        <div class="bg-slate-700 text-slate-200 px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap shadow-sm">
                            Hello! I am your SOC Copilot. If you run a simulation and detect an anomaly, you can ask me how to mitigate the threat.
                        </div>
                    </div>
                </div>

                <!-- Chat Input Area -->
                <div class="p-4 border-t border-slate-700 bg-slate-800/50 rounded-b-xl shrink-0">
                    <form id="chatForm" class="flex space-x-2">
                        <input type="text" id="chatInput" placeholder="Ask me how to mitigate this threat..." class="flex-1 bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none shadow-inner">
                        <button type="submit" id="chatBtn" class="bg-blue-600 px-6 py-3 rounded-xl text-sm font-bold hover:bg-blue-700 transition-colors shadow-lg flex items-center justify-center">
                            <svg class="w-4 h-4 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        const form = document.getElementById('logForm');
        const resultPanel = document.getElementById('resultPanel');
        const chatHistory = document.getElementById('chatHistory');
        const chatForm = document.getElementById('chatForm');

        // Analyze Log Logic
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultPanel.classList.add('hidden', 'translate-y-4', 'opacity-0');
            
            const payload = {
                component: document.getElementById('component').value,
                level: document.getElementById('level').value,
                event_template: document.getElementById('event_template').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                const badge = document.getElementById('predictionBadge');
                
                resultPanel.classList.remove('hidden');
                setTimeout(() => resultPanel.classList.remove('translate-y-4', 'opacity-0'), 50);

                if (data.prediction === 'Anomaly') {
                    badge.className = "px-3 py-1 rounded-full text-sm font-bold bg-red-900 text-red-400 border border-red-700";
                    badge.innerText = "⚠️ ANOMALY";
                    document.getElementById('mitreText').innerText = data.mitre_tactic;
                } else {
                    badge.className = "px-3 py-1 rounded-full text-sm font-bold bg-green-900 text-green-400 border border-green-700";
                    badge.innerText = "✅ NORMAL";
                    document.getElementById('mitreText').innerText = "N/A";
                }
                
                document.getElementById('explanationText').innerText = data.explanation;

            } catch (error) {
                alert("Error connecting to API.");
            }
        });

        // Chat Logic
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;
            
            // 1. Add User Message (Right aligned)
            const userBubble = `
                <div class="flex items-start justify-end">
                    <div class="bg-blue-600 text-white px-4 py-3 rounded-2xl rounded-tr-none max-w-[85%] text-sm leading-relaxed shadow-sm">
                        ${msg}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center text-white shrink-0 ml-3">You</div>
                </div>
            `;
            chatHistory.innerHTML += userBubble;
            input.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 2. Add Typing Indicator
            const typingId = 'typing-' + Date.now();
            const typingBubble = `
                <div id="${typingId}" class="flex items-start">
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 mr-3">AI</div>
                    <div class="bg-slate-700 text-slate-400 px-4 py-3 rounded-2xl rounded-tl-none text-sm italic shadow-sm flex items-center space-x-1">
                        <span class="animate-pulse">Analyzing</span>
                        <span class="animate-pulse delay-75">.</span>
                        <span class="animate-pulse delay-150">.</span>
                        <span class="animate-pulse delay-200">.</span>
                    </div>
                </div>
            `;
            chatHistory.innerHTML += typingBubble;
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            const context = document.getElementById('event_template').value;
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, log_context: context})
                });
                const data = await res.json();
                
                // Remove typing indicator
                document.getElementById(typingId).remove();

                const replyText = data.reply ? data.reply : `Error: ${data.detail || 'Could not reach LLM'}`;
                
                // 3. Add AI Message (Left aligned)
                const aiBubble = `
                    <div class="flex items-start">
                        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 mr-3">AI</div>
                        <div class="bg-slate-700 text-slate-200 px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap shadow-sm">
                            ${replyText}
                        </div>
                    </div>
                `;
                chatHistory.innerHTML += aiBubble;
                chatHistory.scrollTop = chatHistory.scrollHeight;

            } catch(e) {
                document.getElementById(typingId).remove();
                chatHistory.innerHTML += `
                    <div class="flex items-start">
                        <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white shrink-0 mr-3">!</div>
                        <div class="bg-red-900/50 text-red-200 px-4 py-3 rounded-2xl rounded-tl-none text-sm shadow-sm">
                            Network error. Could not connect to Copilot.
                        </div>
                    </div>
                `;
            }
        });

        // Simulation
        document.getElementById('simulateBtn').addEventListener('click', function() {
            document.getElementById('component').value = "dfs.FSNamesystem";
            document.getElementById('level').value = "ERROR";
            document.getElementById('event_template').value = "BLOCK* NameSystem.addStoredBlock: blockMap updated: <*> is added to <*> size <*>";
            form.dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
