<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSA Log Triage Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #38bdf8; text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #475569; border-radius: 4px; background-color: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0ea5e9; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #0284c7; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; font-family: monospace; font-size: 14px; }
        .anomaly { background-color: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; }
        .normal { background-color: #064e3b; border: 1px solid #10b981; color: #6ee7b7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ INSA Log Triage Dashboard</h1>
        
        <div class="card">
            <form id="logForm">
                <label>Component</label>
                <input type="text" id="component" value="dfs.FSNamesystem" required>
                
                <label>Level</label>
                <select id="level">
                    <option value="INFO">INFO</option>
                    <option value="WARN" selected>WARN</option>
                    <option value="ERROR">ERROR</option>
                </select>
                
                <label>Event Template</label>
                <input type="text" id="event_template" value="BLOCK* NameSystem.addStoredBlock: blockMap updated: <*> is added to <*> size <*>" required>
                
                <button type="submit">Analyze Log</button>
            </form>
            <div id="result"></div>
        </div>
    </div>

    <script>
        document.getElementById('logForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = 'Analyzing...';

            const payload = {
                component: document.getElementById('component').value,
                level: document.getElementById('level').value,
                event_template: document.getElementById('event_template').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.prediction === 'Anomaly') {
                    resultDiv.className = 'anomaly';
                    resultDiv.innerHTML = `<h3>⚠️ ALERT TRIGGERED</h3>
                                           <p><strong>Prediction:</strong> ${data.prediction}</p>
                                           <p><strong>Explanation:</strong> ${data.explanation}</p>`;
                } else {
                    resultDiv.className = 'normal';
                    resultDiv.innerHTML = `<h3>✅ Normal Behavior</h3>
                                           <p><strong>Prediction:</strong> ${data.prediction}</p>`;
                }
            } catch (error) {
                resultDiv.className = 'anomaly';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>Could not connect to the API. Is the server running?</p>`;
            }
        });
    </script>
</body>
</html>
